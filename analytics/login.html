<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark light">
<title>Acesso restrito</title>
<style nonce="__NONCE__">
:root{--bg:#0a0a0b;--card:#141416;--fg:#ededee;--mute:#9b9b9f;--line:rgba(255,255,255,.12);--btn:#ededee;--btnfg:#0a0a0b}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--mute:#6e6e73;--line:rgba(0,0,0,.12);--btn:#0b0b0d;--btnfg:#fff}}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding:20px}
form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;gap:14px}
h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}p{margin:0;color:var(--mute);font-size:14px}
label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
input{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
input:focus{outline:2px solid var(--fg);outline-offset:1px}
button{font:inherit;font-weight:600;min-height:48px;border:0;border-radius:999px;background:var(--btn);color:var(--btnfg);cursor:pointer;margin-top:6px}
.err{color:#ff6b6b;font-size:14px;background:rgba(255,107,107,.1);border-radius:12px;padding:10px 12px}
</style>
</head>
<body>
<form method="post" action="/analytics/login" autocomplete="on">
<div><h1>Analytics</h1><p>Acesso restrito.</p></div>
<!--MSG-->
<label>Usuário<input name="u" type="text" autocomplete="username" required autofocus maxlength="200"></label>
<label>Senha<input name="p" type="password" autocomplete="current-password" required maxlength="400"></label>
<button type="submit">Entrar</button>
</form>
</body>
</html>
